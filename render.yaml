# Render Blueprint — runs Reelhaven's server (server.py) as a Docker web
# service, the same way FriendZone runs. In Render: New + → Blueprint → pick
# this repository → Apply.
#
# Accounts, friends and cloud saves live in /data/reelhaven.json on a
# persistent disk, so they survive restarts and redeploys. (Disks need a paid
# instance type; keep `plan` and `disk` in sync with the Render dashboard so a
# Blueprint sync never downgrades the service or detaches the disk.)
services:
  - type: web
    name: reelhaven
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: RH_DATA
        value: /data/reelhaven.json
    disk:
      name: reelhaven-data
      mountPath: /data
      sizeGB: 1
